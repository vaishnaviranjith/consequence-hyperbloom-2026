name: verify

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile backend
        run: python -m py_compile server.py
      - name: Exercise deterministic fallback
        run: |
          python - <<'PY'
          import server
          body = {
              "chunks": [
                  {"id": "h1", "content": "Clinic operations"},
                  {"id": "h2", "content": "Building A has 6 rooms and compliant access."},
                  {"id": "h3", "content": "Building B has 4 rooms, lower waiting capacity, access constraints, emergency-route constraints, and cold-storage constraints."},
              ],
              "change": "Move the community clinic from Building A to Building B next month.",
          }
          result = server._fallback_simulation(body, "CI smoke test")
          data = result["data"]
          assert data["consequences"], "expected consequences"
          assert data["metrics"]["entitiesAffected"] > 0
          assert data["executiveDecision"]["decision"] in {"GO", "GO WITH CONDITIONS", "DO NOT PROCEED"}
          print("fallback smoke test: PASS")
          PY
      - name: Validate browser scripts
        run: |
          node - <<'NODE'
          const fs = require("fs");
          for (const file of ["commercial-mvp.html", "sales.html", "pilot.html"]) {
            const html = fs.readFileSync(file, "utf8");
            const scripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];
            for (const match of scripts) new Function(match[1]);
            console.log(file + ": PASS");
          }
          NODE
